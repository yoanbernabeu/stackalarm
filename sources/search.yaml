# How the CVE databases (NVD, EUVD) are searched for each tag. Not a source.

# Ambiguous tags, replaced by a precise word in searches and when matching
# the entries of general sources: "node" alone matches hundreds of Linux
# kernel CVEs (NUMA nodes, inodes), "go" almost anything.
aliases:
  node: node.js
  nextjs: next.js
  go: golang
  dotnet: .net
  # "echo" alone matches kernel and network CVEs (echo requests, Junos).
  echo: labstack
  # "vault" alone matches Azure Key Vault and note-taking vaults.
  vault: hashicorp vault
  consul: hashicorp consul
  # The tags are written with a dash, the texts with a space or another name.
  api-platform: api platform
  anthropic-sdk: anthropic
  gcp: google cloud
  # Common words, or names shared with something else: Azure Synapse, Hyper-V,
  # a "monthly rollup" of patches, the Tower of Babel, a plausible scenario.
  flux: fluxcd
  hyper: hyperium
  synapse: matrix synapse
  rollup: rollup.js
  babel: babeljs
  bind: bind 9
  apollo: apollo server
  tornado: tornadoweb
  plausible: plausible analytics
  backstage: spotify backstage
  outline: getoutline
  drizzle: drizzle orm
  # "apache" alone names every project of the foundation.
  apache: apache http server
  # Written with a dot, a dash or a space in the texts.
  vertx: vert.x
  wikijs: wiki.js
  pihole: pi-hole
  rocketchat: rocket.chat
  uptime-kuma: uptime kuma
  argo-workflows: argo workflows

# Tags the CVE databases are not searched for by word. General sources (CERTs,
# KEV, press) still match them, and an explicit --keyword is still searched.
# Those with a product under "cpe" below are searched in the NVD by product.
skip:
  # The word means something else: OpenStack Swift, ms-swift; the MediaWiki
  # Cargo extension; Windows Internet Connection Sharing, Ivanti ICS; Visual
  # Composer, Oracle BPM Composer.
  - swift
  - cargo
  - ics
  - composer
  # Package managers: every CVE of the ecosystem names them. Their GitHub
  # Advisory Database source, narrowed with --package, covers the project.
  - npm
  - pip
  - maven
  - nuget
  # CI: its advisories are in its own sources (ghsa-actions, osv-actions, the
  # GitHub changelog); the word in the CVE databases brings every project
  # whose workflows mention it.
  - github-actions
  # Frameworks the CVE databases name in the description of every app built
  # with them. Their GitHub advisories source covers their own flaws.
  - fastapi
  - flask
  - nestjs
  - vue
  - twig
  - mcp
  # Common words: "crafted requests" is in every other CVE, "git" and "curl"
  # in every proof of concept; "ws", "uv", "chi" and "zed" are syllables.
  # Their GitHub advisories source covers their own flaws, and git and curl
  # are searched in the NVD by product (see cpe).
  - requests
  - cryptography
  - git
  - curl
  - ws
  - uv
  - chi
  - zed
  # Every product of the vendor: hundreds of CVEs a month. The oracle-security
  # source carries its patch updates.
  - oracle

# The product of a tag in the NVD dictionary, as vendor:product (checked with
# https://services.nvd.nist.gov/rest/json/cpes/2.0?cpeMatchString=cpe:2.3:a:<it>).
# A skipped tag that has one is searched in the NVD by product instead of by
# word: the records of the product itself, without those that only mention
# it. For every tag listed, the version ranges of the NVD records are shown
# under the tag name, and compared with the version given (--tag php@8.3.20).
cpe:
  # Skipped above, searched by product.
  flask: palletsprojects:flask
  fastapi: tiangolo:fastapi
  nestjs: nestjs:nest
  twig: symfony:twig
  npm: npmjs:npm
  pip: pypa:pip
  maven: apache:maven
  nuget: microsoft:nuget
  composer: getcomposer:composer
  cargo: rust-lang:cargo
  swift: apple:swift
  git: git-scm:git
  curl: haxx:curl
  # Searched by word: only their version ranges are named after the tag.
  php: php:php
  node: nodejs:node.js
  nextjs: vercel:next.js
  go: golang:go
  python: python:python
  ruby: ruby-lang:ruby
  symfony: sensiolabs:symfony
  laravel: laravel:framework
  django: djangoproject:django
  rails: rubyonrails:rails
  nginx: f5:nginx
  postgresql: postgresql:postgresql
  redis: redis:redis
  gitlab: gitlab:gitlab
  wordpress: wordpress:wordpress
  drupal: drupal:drupal
  grafana: grafana:grafana
  kubernetes: kubernetes:kubernetes
  jenkins: jenkins:jenkins
  keycloak: redhat:keycloak
  angular: angular:angular
  react: facebook:react
  express: openjsf:express
  astro: astro:astro
  mysql: oracle:mysql
  elasticsearch: elastic:elasticsearch
  traefik: traefik:traefik
  caddy: caddyserver:caddy
  deno: deno:deno
  nuxt: nuxt:nuxt
  spring: vmware:spring_framework
  electron: electronjs:electron
  openssl: openssl:openssl
  mariadb: mariadb:mariadb
  mongodb: mongodb:mongodb
  tensorflow: google:tensorflow
  pytorch: linuxfoundation:pytorch
  jupyter: jupyter:notebook
  squid: squid-cache:squid
  bind: isc:bind
  dovecot: dovecot:dovecot
  coredns: coredns.io:coredns
  etcd: etcd:etcd
  clickhouse: clickhouse:clickhouse
  nats: nats:nats_server
  podman: podman_project:podman
  cilium: cilium:cilium
  kyverno: kyverno:kyverno
  rancher: suse:rancher
  phpmyadmin: phpmyadmin:phpmyadmin
  magento: magento:magento
  mediawiki: mediawiki:mediawiki
  matomo: matomo:matomo
  woocommerce: woocommerce:woocommerce
  jellyfin: jellyfin:jellyfin
  metabase: metabase:metabase
  rocketchat: rocket.chat:rocket.chat
  synapse: matrix:synapse
  pihole: pi-hole:pi-hole
  gogs: gogs:gogs
  backstage: linuxfoundation:backstage
  outline: getoutline:outline
