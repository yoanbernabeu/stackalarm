name: Site

# Publishes site/ to GitHub Pages (stackalarm.dev). The site reads sources/, ci/, the
# README and the skill at build time, so a change to any of them republishes it.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - sources/**
      - cmd/**
      - internal/**
      - action.yml
      - ci/**
      - skills/**
      - README.md
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The docs print the CLI's own help, built from the Go code.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true # .well-known/security.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
