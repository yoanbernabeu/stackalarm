<!doctype html>
<!-- The Open Graph image. Regenerate public/og.png with: npm run og -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url(../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2");
        font-weight: 200 800;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2) format("woff2");
        font-weight: 500;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0b0e14 url(../public/hero.webp) 78% center / cover;
        font-family: "Bricolage Grotesque", sans-serif;
        color: #10131c;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 65% at 40% 38%, rgb(238 234 240 / 0.8), transparent 70%),
          linear-gradient(180deg, transparent 0 66%, rgb(11 14 20 / 0.85) 84%, #0b0e14 100%);
      }
      main {
        position: relative;
        padding: 64px 72px;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      h1 {
        margin: 24px 0 0;
        font-size: 92px;
        line-height: 0.95;
        letter-spacing: -0.045em;
        font-weight: 750;
        max-width: 760px;
      }
      p {
        margin: auto 0 0;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        color: #ecebe6;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      code {
        font: 500 22px "IBM Plex Mono", monospace;
        letter-spacing: 0;
        color: #ff8a4c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Security news, matched to your stack</h1>
      <p>/stackalarm <code>npx skills add yoanbernabeu/stackalarm</code></p>
    </main>
  </body>
</html>
