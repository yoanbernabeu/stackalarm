name: Site

# Publishes site/ to GitHub Pages (stackalarm.dev). The site reads sources/, ci/, the
# README and the skill at build time, so a change to any of them republishes it.
#
# The /tech/ pages show the news of the last 30 days for each tag. It is
# gathered once a day with the CLI of the commit (about 25 minutes without an
# NVD key, 4 with the NVD_API_KEY secret), kept in the cache, and reused by
# the builds a push starts. If the gathering fails, nothing is published and
# the site stays as it was.
on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - site/**
      - sources/**
      - cmd/**
      - internal/**
      - action.yml
      - ci/**
      - skills/**
      - README.md
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The docs print the CLI's own help, built from the Go code.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Restore the news of the technology pages
        id: tech
        uses: actions/cache/restore@v6
        with:
          path: site/.data/tech
          key: tech-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tech-
      - name: Gather the news of the technology pages
        id: gather
        if: github.event_name != 'push' || steps.tech.outputs.cache-matched-key == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: npm run tech
      - name: Keep the news for the next builds
        if: steps.gather.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: site/.data/tech
          key: tech-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true # .well-known/security.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
